# Blueprint de Render: Evolution API v2.
# Evolution v2 exige base de datos: aquí se usa la de Supabase (sin base propia en Render).
services:
  - type: web
    name: evolution-api
    runtime: image
    image:
      url: docker.io/atendai/evolution-api:v2.1.1
    plan: free # se duerme tras 15 min sin tráfico; para 24/7 usa starter
    healthCheckPath: /
    envVars:
      - key: SERVER_PORT
        value: "8080"
      - key: AUTHENTICATION_API_KEY
        sync: false # se escribe en el panel de Render, no en el repo
      - key: SERVER_URL
        value: https://evolution-api-agjw.onrender.com
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_CONNECTION_URI
        sync: false # URI del Session pooler de Supabase + ?schema=evolution_api (se pega en el panel)
      - key: DATABASE_SAVE_DATA_INSTANCE
        value: "true"
      - key: DATABASE_SAVE_DATA_NEW_MESSAGE
        value: "true"
      - key: CACHE_REDIS_ENABLED
        value: "false"
      - key: CACHE_LOCAL_ENABLED
        value: "true"
      - key: WEBHOOK_GLOBAL_ENABLED
        value: "false" # el webhook se define por instancia

