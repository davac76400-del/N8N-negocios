# Blueprint de Render: plan gratuito. Los secretos (sync: false) se piden al crearlo y no viven en git.
services:
  - type: web
    name: bots-whatsapp
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - { key: ADMIN_USER, value: admin }
      - { key: LLM_MODEL, value: llama-3.3-70b-versatile }
      - { key: ZONA_HORARIA, value: America/Mexico_City }
      - { key: DATABASE_URL, sync: false }
      - { key: ADMIN_PASSWORD, sync: false }
      - { key: WA_VERIFY_TOKEN, sync: false }
      - { key: WA_APP_SECRET, sync: false }
      - { key: WA_ACCESS_TOKEN, sync: false }
      - { key: LLM_API_KEY, sync: false }
