<title>Alta de Asistente WhatsApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* Concepto: una conversación. Cada paso es una pregunta del asistente (burbuja blanca) y lo que eliges se vuelve tu respuesta (burbuja de color). */
:root{
  --bg:#eef3f5; --paper:#ffffff; --ink:#0e1b22; --muted:#506068; --line:#d5dfe3;
  --accent:#087a62; --accent-ink:#ffffff; --accent-soft:#dff3ec;
  --warn:#8a4b00; --warn-bg:#fff1dc; --ok:#116b45; --ok-bg:#e0f4ea; --focus:#087a62;
  --display:"Outfit",ui-sans-serif,system-ui,sans-serif; --body:"Figtree",ui-sans-serif,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1418; --paper:#14232a; --ink:#e7f0f3; --muted:#9db1b9; --line:#27393f;
  --accent:#3fd1a8; --accent-ink:#04211a; --accent-soft:#12372f;
  --warn:#ffc277; --warn-bg:#3a2a12; --ok:#6fe0a8; --ok-bg:#12301f; --focus:#3fd1a8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1418; --paper:#14232a; --ink:#e7f0f3; --muted:#9db1b9; --line:#27393f;
  --accent:#3fd1a8; --accent-ink:#04211a; --accent-soft:#12372f;
  --warn:#ffc277; --warn-bg:#3a2a12; --ok:#6fe0a8; --ok-bg:#12301f; --focus:#3fd1a8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);padding-inline:16px;padding-block:20px 120px}
.wrap{max-width:640px;margin-inline:auto;display:grid;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.marca{font:700 1rem var(--display);letter-spacing:.01em}
.idioma{display:flex;gap:6px}
.idioma button{font:600 .85rem var(--body);background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.idioma button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.prog{display:grid;grid-auto-flow:column;gap:6px}
.prog i{height:6px;border-radius:3px;background:var(--line)}
.prog i.hecho{background:var(--accent)}
.paso{font-size:.85rem;color:var(--muted);margin:0}
.q{background:var(--paper);border:1px solid var(--line);border-radius:4px 20px 20px 20px;padding:16px 18px;max-width:92%}
.q h1{font:600 clamp(1.3rem,4.5vw,1.65rem)/1.2 var(--display);margin:0;text-wrap:balance}
.q p{margin:6px 0 0;color:var(--muted);font-size:.95rem}
#app{display:grid;gap:16px}
.campos{display:grid;gap:16px}
.campo{display:grid;gap:6px;min-width:0}
label,.lbl{font-weight:600;font-size:.95rem}
.req{font-weight:500;font-size:.78rem;color:var(--muted);margin-left:6px}
.ayuda{font-size:.85rem;color:var(--muted);margin:0}
.msg{font-size:.85rem;color:var(--warn);margin:0}
input,textarea,select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-width:0}
textarea{min-height:92px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.campo.err input,.campo.err textarea,.campo.err select,.campo.err .opts{border-color:var(--warn)}
.opts{display:flex;flex-wrap:wrap;gap:8px;border:1px solid transparent;border-radius:14px}
.opt{font:500 .95rem var(--body);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:10px 16px;cursor:pointer;text-align:left}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);border-radius:18px 18px 4px 18px}
.paises{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.pais{font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;text-align:left;display:grid;gap:6px;align-content:start}
.pais b{font:600 1.2rem var(--display)}
.pais span{font-size:.85rem;color:var(--muted)}
.pais:hover{border-color:var(--accent)}
.pais[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.aviso{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:14px;padding:12px 14px;font-size:.92rem}
.aviso[hidden]{display:none}
details{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
summary{cursor:pointer;font-weight:600}
details .campos{margin-top:14px}
.res{display:grid;gap:0;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:4px 16px}
.res div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
.res div:last-child{border-bottom:0}
.res dt{color:var(--muted);font-size:.9rem;margin:0;flex:0 1 45%}
.res dd{margin:0;font-weight:600;text-align:right;min-width:0;overflow-wrap:break-word;flex:1 1 auto}
.lista{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
.lista h2{font:600 1.1rem var(--display);margin:0}
.lista label{display:grid;grid-template-columns:22px 1fr;gap:10px;font-weight:400;font-size:.95rem;align-items:start;cursor:pointer}
.lista input{width:20px;height:20px;padding:0;margin:2px 0 0;accent-color:var(--accent)}
.cuenta{font-size:.85rem;color:var(--ok);background:var(--ok-bg);border-radius:999px;padding:3px 10px;justify-self:start;font-weight:600}
.envio textarea{font:400 .8rem/1.5 var(--mono);min-height:160px}
.barra{position:fixed;inset-inline:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.barra div{max-width:640px;margin-inline:auto;display:flex;gap:10px;justify-content:space-between}
button.main,button.sec{font:600 1rem var(--body);border-radius:12px;padding:13px 22px;cursor:pointer;border:1px solid var(--accent)}
button.main{background:var(--accent);color:var(--accent-ink);flex:1}
button.sec{background:transparent;color:var(--accent)}
button[hidden]{display:none}
.ok{color:var(--ok);font-weight:600}
[hidden]{display:none!important}
.pantalla{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;justify-content:center;gap:16px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
#intro{align-items:center;cursor:pointer}
.anim{display:grid;gap:22px;justify-items:center;animation:sale .3s 2.7s forwards}
.burbuja{display:grid;background:var(--paper);border:1px solid var(--line);border-radius:6px 30px 30px 30px;padding:24px 34px;animation:sube .5s both}
.burbuja>*{grid-area:1/1;align-self:center;justify-self:center}
.pts{display:flex;gap:8px;animation:fuera .2s 1.5s forwards}
.pts i{width:13px;height:13px;border-radius:50%;background:var(--accent);animation:salta 1s infinite}
.pts i:nth-child(2){animation-delay:.15s}.pts i:nth-child(3){animation-delay:.3s}
.hola{font:600 clamp(1.5rem,6vw,2rem) var(--display);opacity:0;animation:entra .4s 1.6s forwards}
.nombre{font:700 1.05rem var(--display);letter-spacing:.02em;color:var(--muted);text-align:center;opacity:0;animation:entra .5s .4s forwards}
.lang{flex:1 1 0;max-height:46vh;width:100%;max-width:640px;margin-inline:auto;font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:28px;padding:20px 26px;cursor:pointer;display:grid;gap:8px;align-content:center;text-align:left}
.lang small{font:500 clamp(1rem,4vw,1.2rem) var(--body);color:var(--muted)}
.lang b{font:700 clamp(2.6rem,13vw,4.6rem)/1 var(--display)}
.lang:hover,.lang:focus-visible{border-color:var(--accent);background:var(--accent-soft)}
.reglas{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:6px 16px;display:grid}
.reglas>div{padding:12px 0;border-bottom:1px solid var(--line)}
.reglas>div:nth-last-child(2){border-bottom:0}
.reglas b{font:600 1rem var(--display)}
.reglas p{margin:4px 0 0;color:var(--muted);font-size:.93rem}
.reglas>p.ayuda{padding:10px 0 12px;margin:0}
@keyframes sube{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes salta{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-8px);opacity:1}}
@keyframes fuera{to{opacity:0}}
@keyframes entra{to{opacity:1}}
@keyframes sale{to{opacity:0;transform:scale(.97)}}
@media (prefers-reduced-motion:reduce){.anim,.burbuja,.pts,.pts i,.hola,.nombre{animation:none!important}.pts{display:none}.hola,.nombre{opacity:1}}
@media (max-width:420px){.paises{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

<main class="wrap" hidden>
  <div class="top"><span class="marca" id="marca"></span><div class="idioma" role="group" aria-label="Idioma / Language"><button type="button" data-l="es" aria-pressed="false">Español</button><button type="button" data-l="en" aria-pressed="false">English</button></div></div>
  <div class="prog" id="prog" aria-hidden="true"></div>
  <p class="paso" id="paso" role="status"></p>
  <div class="q"><h1 id="h1"></h1><p id="sub"></p></div>
  <div id="app"></div>
</main>
<div class="barra" hidden><div><button type="button" class="sec" id="atras"></button><button type="button" class="main" id="sigue"></button></div></div>
<section class="pantalla" id="intro" aria-label="WhatsApp"><div class="anim"><div class="burbuja"><span class="pts"><i></i><i></i><i></i></span><span class="hola">Hola · Hello</span></div><p class="nombre">WhatsApp · Asistente / Assistant</p></div></section>
<section class="pantalla" id="idioma" hidden><button type="button" class="lang" data-l="en"><small>What language do you speak?</small><b>English</b></button><button type="button" class="lang" data-l="es"><small>¿Qué idioma hablas?</small><b>Español</b></button></section>

<script>
const FORM = /*SCHEMA*/null;
const T = {
  es: { marca: 'Alta de tu asistente de WhatsApp', paso: (n, m) => `Paso ${n} de ${m}`, atras: 'Atrás', sigue: 'Siguiente', revisar: 'Revisar', copiar: 'Copiar datos para enviar', req: 'obligatorio', opt: 'opcional', elige: 'Elige…',
    falta: 'Falta este dato.', tel: 'Solo dígitos, con lada de país. Ejemplos: 529511234567 (México), 15551234567 (EE. UU.).', mail: 'Ese correo no parece válido.', ent: 'Escribe un número entero.', telAyuda: 'Con lada de país, sin + ni espacios.',
    opcionales: 'Más opciones (opcional)',
    q: { ubicacion: ['¿De dónde es tu negocio?', 'Elige primero el país. Cambia los estados y lo que necesitas preparar.'], negocio: ['Cuéntame de tu negocio', 'Usa el nombre legal igual que en tus documentos.'], whatsapp: ['¿Con qué número atenderá el asistente?', 'Y quién recibe los avisos cuando alguien pide una persona.'], respuestas: ['¿Qué puede contestar el asistente?', 'Solo contesta con lo que escribas aquí. No inventa precios ni horarios.'], politicas: ['Reglas de tu país', 'Léelas rápido y confirma.'], revision: ['Todo listo. Revisa y copia.', 'Nada se envía desde esta página. Tú copias el resultado y lo mandas.'] },
    paisSub: { MX: '32 estados. Hotel, restaurante, citas y salud (con consentimiento).', US: '50 estados y D.C. Hotel, restaurante y citas. Salud no disponible (HIPAA).' },
    bloqueo: 'En Estados Unidos WhatsApp no se puede usar con información de salud de pacientes (Meta no firma el acuerdo HIPAA). Puedes enviar este formulario igual: te propondremos otra vía, como mensajes de texto con un proveedor que sí lo firme.',
    saludMx: 'En México se permite con consentimiento expreso del paciente y sin guardar datos clínicos en el chat.',
    resumen: 'Tus datos', lista: n => `${n} listos`, ya: 'Ya lo tengo',
    copiado: 'Copiado. Pégalo en un mensaje y mándalo a quien te pidió este formulario.', manual: 'Selecciona todo el texto de abajo, cópialo y mándalo a quien te pidió este formulario.', corrige: 'Revisa los datos marcados.' },
  en: { marca: 'Set up your WhatsApp assistant', paso: (n, m) => `Step ${n} of ${m}`, atras: 'Back', sigue: 'Next', revisar: 'Review', copiar: 'Copy details to send', req: 'required', opt: 'optional', elige: 'Choose…',
    falta: 'This field is required.', tel: 'Digits only, with country code. Examples: 15551234567 (US), 529511234567 (Mexico).', mail: 'That email does not look valid.', ent: 'Enter a whole number.', telAyuda: 'With country code, no + or spaces.',
    opcionales: 'More options (optional)',
    q: { ubicacion: ['Where is your business?', 'Pick the country first. It changes the states and what you need to prepare.'], negocio: ['Tell me about your business', 'Use the legal name exactly as on your documents.'], whatsapp: ['Which number will the assistant use?', 'And who gets the alerts when someone asks for a person.'], respuestas: ['What can the assistant answer?', 'It only answers with what you write here. It never makes up prices or hours.'], politicas: ['Rules in your country', 'Read them quickly and confirm.'], revision: ['All set. Review and copy.', 'Nothing is sent from this page. You copy the result and send it yourself.'] },
    paisSub: { MX: '32 states. Hotels, restaurants, appointments and health (with consent).', US: '50 states and D.C. Hotels, restaurants and appointments. Health not available (HIPAA).' },
    bloqueo: 'In the United States WhatsApp cannot be used with patient health information (Meta does not sign a HIPAA agreement). You can still send this form: we will propose another channel, such as text messages through a provider that does sign one.',
    saludMx: 'In Mexico it is allowed with the patient\'s express consent and no clinical data stored in the chat.',
    resumen: 'Your details', lista: n => `${n} ready`, ya: 'I have it',
    copiado: 'Copied. Paste it into a message and send it to whoever gave you this form.', manual: 'Select all the text below, copy it and send it to whoever gave you this form.', corrige: 'Check the highlighted fields.' },
};
const PASOS = [['ubicacion'], ['negocio'], ['whatsapp'], ['respuestas', 'tono'], ['politicas'], []];
const LLAVE = 'alta-whatsapp-v3', LLAVE_L = 'alta-whatsapp-idioma';
const $ = x => document.querySelector(x);
const esc = x => String(x).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let S = (() => { try { return JSON.parse(localStorage.getItem(LLAVE) || '{}'); } catch { return {}; } })();
let L = (() => { try { const g = localStorage.getItem(LLAVE_L); if (g) return g; } catch {} return /^es/i.test(navigator.language || '') ? 'es' : 'en'; })();
let paso = 0, tocado = false, msgCopia = null;
const u = k => T[L][k];
const seccion = id => FORM.secciones.find(s => s.id === id);
const campos = FORM.secciones.flatMap(s => s.campos);
const val = c => S[c.clave] ?? c.defecto ?? '';
const visible = c => (!c.paises || c.paises.includes(S.pais)) && (!c.opcionesPor || !!c.opcionesPor[S.pais]);
const opcionesDe = c => c.opcionesPor ? (c.opcionesPor[S.pais] || []).map(v => ({ v, es: v, en: v })) : c.clave === 'zona_horaria' && S.pais ? c.opciones.filter(o => o.p === S.pais) : c.opciones;
const etiquetaOpcion = (c, v) => (opcionesDe(c).find(o => o.v === v) || {})[L] || v;
const guardar = () => { try { localStorage.setItem(LLAVE, JSON.stringify(S)); } catch {} };
const limpio = c => { let x = String(val(c)).trim(); if (c.tipo === 'telefono') x = x.replace(/[\s+()\-.]/g, ''); return x; };

function error(c) {
  const x = limpio(c);
  if (x === '') return c.requerido ? u('falta') : '';
  if (c.tipo === 'telefono' && !/^\d{10,15}$/.test(x)) return u('tel');
  if (c.tipo === 'correo' && !/^\S+@\S+\.\S+$/.test(x)) return u('mail');
  if (c.tipo === 'entero' && !/^\d+$/.test(x)) return u('ent');
  return '';
}
const camposDe = ids => ids.flatMap(id => seccion(id).campos).filter(visible);
const errores = ids => camposDe(ids).filter(c => error(c));

function control(c) {
  const v = val(c), id = `c-${c.clave}`, desc = `aria-describedby="a-${c.clave} m-${c.clave}"`;
  if (c.clave === 'pais') return `<div class="paises" role="group" aria-labelledby="l-pais">${opcionesDe(c).map(o => `<button type="button" class="pais" data-k="pais" data-v="${o.v}" aria-pressed="${v === o.v}"><b>${esc(o[L])}</b><span>${esc(u('paisSub')[o.v])}</span></button>`).join('')}</div>`;
  if (c.tipo === 'opcion') {
    const ops = opcionesDe(c);
    if (ops.length <= 4) return `<div class="opts" role="group" aria-labelledby="l-${c.clave}" ${desc}>${ops.map(o => `<button type="button" class="opt" data-k="${c.clave}" data-v="${o.v}" aria-pressed="${v === o.v}">${esc(o[L])}</button>`).join('')}</div>`;
    return `<select id="${id}" data-k="${c.clave}" ${desc}><option value="">${esc(u('elige'))}</option>${ops.map(o => `<option value="${esc(o.v)}"${v === o.v ? ' selected' : ''}>${esc(o[L])}</option>`).join('')}</select>`;
  }
  if (c.tipo === 'largo') return `<textarea id="${id}" data-k="${c.clave}" ${desc}>${esc(v)}</textarea>`;
  const attr = c.tipo === 'telefono' ? 'inputmode="numeric" autocomplete="tel-national"' : c.tipo === 'correo' ? 'type="email" autocomplete="email"' : c.tipo === 'entero' ? 'inputmode="numeric"' : 'type="text"';
  return `<input id="${id}" data-k="${c.clave}" ${attr} value="${esc(v)}" ${desc}>`;
}
function campoHtml(c) {
  const ayuda = c.ayuda ? c.ayuda[L] : c.tipo === 'telefono' ? u('telAyuda') : '';
  const e = tocado ? error(c) : '';
  return `<div class="campo${e ? ' err' : ''}" data-clave="${c.clave}"><span class="lbl" id="l-${c.clave}"><label for="c-${c.clave}">${esc(c.etiqueta[L])}</label><span class="req">${c.requerido ? u('req') : u('opt')}</span></span>${control(c)}<p class="ayuda" id="a-${c.clave}">${esc(ayuda)}</p><p class="msg" id="m-${c.clave}">${esc(e)}</p></div>`;
}
const avisoSalud = () => S.salud === 'si' && S.pais === 'US' ? u('bloqueo') : S.salud === 'si' && S.pais === 'MX' ? u('saludMx') : '';

function listaReqs() {
  const R = FORM.requisitos, p = S.pais; if (!R || !R[p]) return '';
  const items = [...R.comun, ...R[p]], hechos = (S._ok || []).filter(i => i < items.length).length;
  return `<div class="lista"><h2>${esc(R.titulo[L])}: ${esc(etiquetaOpcion(campos.find(c => c.clave === 'pais'), p))}</h2><span class="cuenta" id="cuenta">${esc(u('lista')(hechos) + ' / ' + items.length)}</span>${items.map((it, i) => `<label><input type="checkbox" data-ok="${i}"${(S._ok || []).includes(i) ? ' checked' : ''}><span>${esc(it[L])}</span></label>`).join('')}<p class="ayuda">${esc(R.nota[L])}</p></div>`;
}
const reglas = () => { const P = FORM.politicas; return `<div class="reglas">${(P[S.pais] || []).map(i => `<div><b>${esc(i.t[L])}</b><p>${esc(i.x[L])}</p></div>`).join('')}<p class="ayuda">${esc(P.nota[L])}</p></div>`; };
function resumen() {
  const filas = ['pais', 'estado', 'ciudad', 'nombre', 'razon_social', 'giro', 'idioma', 'telefono_bot', 'dueno_nombre', 'dueno_telefono'].map(k => campos.find(c => c.clave === k)).filter(c => c && visible(c) && limpio(c) !== '');
  return `<h2 class="paso">${esc(u('resumen'))}</h2><dl class="res">${filas.map(c => `<div><dt>${esc(c.etiqueta[L].replace(/\s*\(.*$/, ''))}</dt><dd>${esc(c.tipo === 'opcion' ? etiquetaOpcion(c, val(c)) : limpio(c))}</dd></div>`).join('')}</dl>`;
}
function salida() {
  const d = {};
  for (const c of campos.filter(visible)) { const x = limpio(c); if (x !== '') d[c.clave] = c.tipo === 'entero' && /^\d+$/.test(x) ? Number(x) : x; }
  return JSON.stringify({ _formulario: FORM.version, ...d }, null, 2);
}

function pintar() {
  document.documentElement.lang = L;
  document.querySelectorAll('.idioma button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.l === L)));
  const n = PASOS.length, ultimo = paso === n - 1, clave = ['ubicacion', 'negocio', 'whatsapp', 'respuestas', 'politicas', 'revision'][paso];
  $('#marca').textContent = u('marca');
  $('#prog').innerHTML = PASOS.map((_, i) => `<i class="${i <= paso ? 'hecho' : ''}"></i>`).join('');
  $('#paso').textContent = u('paso')(paso + 1, n);
  $('#h1').textContent = u('q')[clave][0]; $('#sub').textContent = u('q')[clave][1];
  $('#atras').textContent = u('atras'); $('#atras').hidden = paso === 0;
  $('#sigue').textContent = ultimo ? u('copiar') : paso === n - 2 ? u('revisar') : u('sigue');
  let h = '';
  if (!ultimo) {
    const [principal, extra] = PASOS[paso];
    h = `<div class="campos">${camposDe([principal]).map(campoHtml).join('')}</div>`;
    if (extra) h += `<details${tocado && errores([extra]).length ? ' open' : ''}><summary>${esc(u('opcionales'))}</summary><div class="campos">${camposDe([extra]).map(campoHtml).join('')}</div></details>`;
    if (principal === 'politicas') h = reglas() + h;
    if (principal === 'negocio' || principal === 'ubicacion') h += `<div class="aviso" id="aviso" ${avisoSalud() ? '' : 'hidden'}>${esc(avisoSalud())}</div>`;
    if (principal === 'ubicacion' && S.pais) h += `<details><summary>${esc(FORM.requisitos.titulo[L])}</summary>${listaReqs()}</details>`;
  } else {
    h = `<div class="aviso" ${avisoSalud() && S.pais === 'US' ? '' : 'hidden'}>${esc(avisoSalud())}</div>${resumen()}${listaReqs()}<div class="envio" ${msgCopia ? '' : 'hidden'}><p class="ok" role="status">${esc(msgCopia || '')}</p><textarea id="envio-x" readonly aria-label="${esc(u('copiar'))}">${esc(salida())}</textarea></div>`;
  }
  $('#app').innerHTML = h;
}
const ir = n => { paso = n; tocado = false; msgCopia = null; pintar(); window.scrollTo({ top: 0 }); };

$('#app').addEventListener('click', e => {
  const b = e.target.closest('button[data-k]'); if (!b) return;
  const k = b.dataset.k; S[k] = b.dataset.v;
  if (k === 'pais') { delete S.estado; delete S.zona_horaria; delete S._ok; }
  guardar(); pintar();
});
$('#app').addEventListener('input', e => {
  const k = e.target.dataset.k; if (!k) return;
  S[k] = e.target.value; guardar();
  if (tocado) { const c = campos.find(x => x.clave === k), caja = e.target.closest('.campo'); const m = error(c); caja.classList.toggle('err', !!m); caja.querySelector('.msg').textContent = m; }
});
$('#app').addEventListener('change', e => {
  if (e.target.dataset.ok !== undefined) {
    const i = Number(e.target.dataset.ok), s = new Set(S._ok || []); e.target.checked ? s.add(i) : s.delete(i); S._ok = [...s]; guardar();
    const R = FORM.requisitos, tot = R.comun.length + R[S.pais].length; $('#cuenta').textContent = u('lista')(s.size) + ' / ' + tot; return;
  }
  const k = e.target.dataset.k; if (!k || e.target.tagName !== 'SELECT') return;
  S[k] = e.target.value;
  if (k === 'estado') { const z = campos.find(c => c.clave === 'estado').tz[S.pais]?.[S.estado]; if (z) S.zona_horaria = z; }
  guardar(); pintar();
});
document.querySelector('.idioma').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.dataset.l === L) return;
  L = b.dataset.l; msgCopia = null; try { localStorage.setItem(LLAVE_L, L); } catch {}
  pintar();
});
$('#atras').addEventListener('click', () => ir(paso - 1));
$('#sigue').addEventListener('click', async () => {
  if (paso < PASOS.length - 1) {
    const fallas = errores(PASOS[paso]);
    if (fallas.length) { tocado = true; pintar(); const p = $('.campo.err input, .campo.err textarea, .campo.err select, .campo.err button'); if (p) p.focus(); return; }
    return ir(paso + 1);
  }
  const todas = errores(PASOS.flat());
  if (todas.length) { const i = PASOS.findIndex(ids => errores(ids).length); tocado = true; paso = i; msgCopia = null; pintar(); return; }
  const texto = salida(); let ok = false;
  try { await navigator.clipboard.writeText(texto); ok = true; } catch {}
  msgCopia = ok ? u('copiado') : u('manual'); pintar();
  const x = $('#envio-x'); if (!ok && x) { x.focus(); x.select(); try { document.execCommand('copy'); } catch {} }
  $('.envio').scrollIntoView({ block: 'nearest' });
});
const mostrarIdioma = () => { if ($('#intro').hidden) return; $('#intro').hidden = true; $('#idioma').hidden = false; };
setTimeout(mostrarIdioma, matchMedia('(prefers-reduced-motion:reduce)').matches ? 800 : 3000);
$('#intro').addEventListener('click', mostrarIdioma);
$('#idioma').addEventListener('click', e => {
  const b = e.target.closest('.lang'); if (!b) return;
  L = b.dataset.l; try { localStorage.setItem(LLAVE_L, L); } catch {}
  $('#idioma').hidden = true; $('.wrap').hidden = false; $('.barra').hidden = false; pintar(); window.scrollTo({ top: 0 });
});
pintar();
</script>
