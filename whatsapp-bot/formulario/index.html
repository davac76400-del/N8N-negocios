<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Alta de Asistente WhatsApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* Concepto: una conversación. Cada paso es una pregunta del asistente (burbuja blanca) y lo que eliges se vuelve tu respuesta (burbuja de color). */
:root{
  --bg:#eef3f5; --paper:#ffffff; --ink:#0e1b22; --muted:#506068; --line:#d5dfe3;
  --accent:#087a62; --accent-ink:#ffffff; --accent-soft:#dff3ec;
  --warn:#8a4b00; --warn-bg:#fff1dc; --ok:#116b45; --ok-bg:#e0f4ea; --focus:#087a62;
  --display:"Outfit",ui-sans-serif,system-ui,sans-serif; --body:"Figtree",ui-sans-serif,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1418; --paper:#14232a; --ink:#e7f0f3; --muted:#9db1b9; --line:#27393f;
  --accent:#3fd1a8; --accent-ink:#04211a; --accent-soft:#12372f;
  --warn:#ffc277; --warn-bg:#3a2a12; --ok:#6fe0a8; --ok-bg:#12301f; --focus:#3fd1a8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1418; --paper:#14232a; --ink:#e7f0f3; --muted:#9db1b9; --line:#27393f;
  --accent:#3fd1a8; --accent-ink:#04211a; --accent-soft:#12372f;
  --warn:#ffc277; --warn-bg:#3a2a12; --ok:#6fe0a8; --ok-bg:#12301f; --focus:#3fd1a8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);padding-inline:16px;padding-block:20px 120px}
.wrap{max-width:640px;margin-inline:auto;display:grid;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.marca{font:700 1rem var(--display);letter-spacing:.01em}
.idioma{display:flex;gap:6px}
.idioma button{font:600 .85rem var(--body);background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.idioma button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.prog{display:grid;grid-auto-flow:column;gap:6px}
.prog i{height:6px;border-radius:3px;background:var(--line)}
.prog i.hecho{background:var(--accent)}
.paso{font-size:.85rem;color:var(--muted);margin:0}
.q{background:var(--paper);border:1px solid var(--line);border-radius:4px 20px 20px 20px;padding:16px 18px;max-width:92%}
.q h1{font:600 clamp(1.3rem,4.5vw,1.65rem)/1.2 var(--display);margin:0;text-wrap:balance}
.q p{margin:6px 0 0;color:var(--muted);font-size:.95rem}
#app{display:grid;gap:16px}
.campos{display:grid;gap:16px}
.campo{display:grid;gap:6px;min-width:0}
label,.lbl{font-weight:600;font-size:.95rem}
.req{font-weight:500;font-size:.78rem;color:var(--muted);margin-left:6px}
.ayuda{font-size:.85rem;color:var(--muted);margin:0}
.msg{font-size:.85rem;color:var(--warn);margin:0}
input,textarea,select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-width:0}
textarea{min-height:92px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.campo.err input,.campo.err textarea,.campo.err select,.campo.err .opts{border-color:var(--warn)}
.opts{display:flex;flex-wrap:wrap;gap:8px;border:1px solid transparent;border-radius:14px}
.opt{font:500 .95rem var(--body);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:10px 16px;cursor:pointer;text-align:left}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);border-radius:18px 18px 4px 18px}
.paises{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.pais{font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;text-align:left;display:grid;gap:6px;align-content:start}
.pais b{font:600 1.2rem var(--display)}
.pais span{font-size:.85rem;color:var(--muted)}
.pais:hover{border-color:var(--accent)}
.pais[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.aviso{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:14px;padding:12px 14px;font-size:.92rem}
.aviso[hidden]{display:none}
details{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
summary{cursor:pointer;font-weight:600}
details .campos{margin-top:14px}
.res{display:grid;gap:0;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:4px 16px}
.res div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
.res div:last-child{border-bottom:0}
.res dt{color:var(--muted);font-size:.9rem;margin:0;flex:0 1 45%}
.res dd{margin:0;font-weight:600;text-align:right;min-width:0;overflow-wrap:break-word;flex:1 1 auto}
.lista{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
.lista h2{font:600 1.1rem var(--display);margin:0}
.lista label{display:grid;grid-template-columns:22px 1fr;gap:10px;font-weight:400;font-size:.95rem;align-items:start;cursor:pointer}
.lista input{width:20px;height:20px;padding:0;margin:2px 0 0;accent-color:var(--accent)}
.cuenta{font-size:.85rem;color:var(--ok);background:var(--ok-bg);border-radius:999px;padding:3px 10px;justify-self:start;font-weight:600}
.envio textarea{font:400 .8rem/1.5 var(--mono);min-height:160px}
.barra{position:fixed;inset-inline:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.barra div{max-width:640px;margin-inline:auto;display:flex;gap:10px;justify-content:space-between}
button.main,button.sec{font:600 1rem var(--body);border-radius:12px;padding:13px 22px;cursor:pointer;border:1px solid var(--accent)}
button.main{background:var(--accent);color:var(--accent-ink);flex:1}
button.sec{background:transparent;color:var(--accent)}
button[hidden]{display:none}
.ok{color:var(--ok);font-weight:600}
[hidden]{display:none!important}
.pantalla{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;justify-content:center;gap:16px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
#intro{align-items:center;cursor:pointer}
.anim{display:grid;gap:22px;justify-items:center;animation:sale .3s 2.7s forwards}
.burbuja{display:grid;background:var(--paper);border:1px solid var(--line);border-radius:6px 30px 30px 30px;padding:24px 34px;animation:sube .5s both}
.burbuja>*{grid-area:1/1;align-self:center;justify-self:center}
.pts{display:flex;gap:8px;animation:fuera .2s 1.5s forwards}
.pts i{width:13px;height:13px;border-radius:50%;background:var(--accent);animation:salta 1s infinite}
.pts i:nth-child(2){animation-delay:.15s}.pts i:nth-child(3){animation-delay:.3s}
.hola{font:600 clamp(1.5rem,6vw,2rem) var(--display);opacity:0;animation:entra .4s 1.6s forwards}
.nombre{font:700 1.05rem var(--display);letter-spacing:.02em;color:var(--muted);text-align:center;opacity:0;animation:entra .5s .4s forwards}
.lang{flex:1 1 0;max-height:46vh;width:100%;max-width:640px;margin-inline:auto;font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:28px;padding:20px 26px;cursor:pointer;display:grid;gap:8px;align-content:center;text-align:left}
.lang small{font:500 clamp(1rem,4vw,1.2rem) var(--body);color:var(--muted)}
.lang b{font:700 clamp(2.6rem,13vw,4.6rem)/1 var(--display)}
.lang:hover,.lang:focus-visible{border-color:var(--accent);background:var(--accent-soft)}
.reglas{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:6px 16px;display:grid}
.reglas>div{padding:12px 0;border-bottom:1px solid var(--line)}
.reglas>div:nth-last-child(2){border-bottom:0}
.reglas b{font:600 1rem var(--display)}
.reglas p{margin:4px 0 0;color:var(--muted);font-size:.93rem}
.reglas>p.ayuda{padding:10px 0 12px;margin:0}
@keyframes sube{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes salta{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-8px);opacity:1}}
@keyframes fuera{to{opacity:0}}
@keyframes entra{to{opacity:1}}
@keyframes sale{to{opacity:0;transform:scale(.97)}}
@media (prefers-reduced-motion:reduce){.anim,.burbuja,.pts,.pts i,.hola,.nombre{animation:none!important}.pts{display:none}.hola,.nombre{opacity:1}}
@media (max-width:420px){.paises{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

</head>

<main class="wrap" hidden>
  <div class="top"><span class="marca" id="marca"></span><div class="idioma" role="group" aria-label="Idioma / Language"><button type="button" data-l="es" aria-pressed="false">Español</button><button type="button" data-l="en" aria-pressed="false">English</button></div></div>

  const todas = errores(PASOS.flat());
  if (todas.length) { const i = PASOS.findIndex(ids => errores(ids).length); tocado = true; paso = i; msgCopia = null; pintar(); return; }
  const texto = salida(); let ok = false;
  try { await navigator.clipboard.writeText(texto); ok = true; } catch {}
  msgCopia = ok ? u('copiado') : u('manual'); pintar();
  const x = $('#envio-x'); if (!ok && x) { x.focus(); x.select(); try { document.execCommand('copy'); } catch {} }
  $('.envio').scrollIntoView({ block: 'nearest' });
});
const mostrarIdioma = () => { if ($('#intro').hidden) return; $('#intro').hidden = true; $('#idioma').hidden = false; };
setTimeout(mostrarIdioma, matchMedia('(prefers-reduced-motion:reduce)').matches ? 800 : 3000);
$('#intro').addEventListener('click', mostrarIdioma);
$('#idioma').addEventListener('click', e => {
  const b = e.target.closest('.lang'); if (!b) return;
  L = b.dataset.l; try { localStorage.setItem(LLAVE_L, L); } catch {}
  $('#idioma').hidden = true; $('.wrap').hidden = false; $('.barra').hidden = false; pintar(); window.scrollTo({ top: 0 });
});
pintar();
</script>
