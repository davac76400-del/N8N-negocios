<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Alta de WhatsApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* Una sola columna de formulario, como una ficha de registro: secciones separadas por un título lateral en pantallas anchas. */
:root{
  --bg:#f3f6f5; --paper:#ffffff; --ink:#14201d; --muted:#53635f; --line:#d3dcd9;
  --accent:#0d5c4b; --accent-ink:#ffffff; --warn:#8a4b00; --warn-bg:#fff1dc; --ok:#146c43; --ok-bg:#e1f4ea; --focus:#0d5c4b;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif; --body:"Public Sans",ui-sans-serif,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1816; --paper:#17231f; --ink:#e6efec; --muted:#9bb0aa; --line:#2b3d38;
  --accent:#4ad0a8; --accent-ink:#06231b; --warn:#ffc277; --warn-bg:#3a2a12; --ok:#6fe0a8; --ok-bg:#12301f; --focus:#4ad0a8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1816; --paper:#17231f; --ink:#e6efec; --muted:#9bb0aa; --line:#2b3d38;
  --accent:#4ad0a8; --accent-ink:#06231b; --warn:#ffc277; --warn-bg:#3a2a12; --ok:#6fe0a8; --ok-bg:#12301f; --focus:#4ad0a8; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body);padding-inline:16px;padding-block:28px 120px}
.wrap{max-width:760px;margin-inline:auto;display:grid;gap:28px}
h1{font:700 clamp(1.7rem,5vw,2.3rem)/1.1 var(--display);letter-spacing:-.01em;text-wrap:balance;margin:0}
.lead{color:var(--muted);max-width:60ch;margin:10px 0 0}
.priv{display:inline-block;margin-top:14px;font-size:.88rem;background:var(--ok-bg);color:var(--ok);padding:6px 12px;border-radius:999px}
fieldset{border:0;margin:0;padding:0;min-width:0;display:grid;gap:16px;grid-template-columns:1fr}
legend{padding:0;font:700 1.15rem/1.2 var(--display);margin-bottom:14px;text-wrap:balance}
.sec{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px 18px}
.campo{display:grid;gap:6px;min-width:0}
label,.lbl{font-weight:600;font-size:.95rem}
.req{font-weight:500;font-size:.78rem;color:var(--muted);margin-left:6px;letter-spacing:.02em}
.ayuda{font-size:.86rem;color:var(--muted);margin:0}
input,textarea,select{box-sizing:border-box;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;width:100%;min-width:0}
textarea{min-height:104px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.campo.err input,.campo.err textarea,.campo.err select{border-color:var(--warn)}
.msg{font-size:.86rem;color:var(--warn);min-height:0;margin:0}
.barra{position:fixed;inset-inline:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.estado{font-size:.92rem;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}
.estado.listo{background:var(--ok-bg);color:var(--ok)}
button.main{font:600 1rem var(--body);background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:12px 20px;cursor:pointer}
button.main[disabled]{opacity:.45;cursor:not-allowed}
details{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 18px}
summary{cursor:pointer;font-weight:600}
pre{margin:12px 0 0;font:400 .82rem/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:340px;overflow:auto}
.envio{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:10px}
.envio[hidden]{display:none}
.envio textarea{font:400 .82rem/1.5 var(--mono);min-height:150px}
@media (min-width:720px){.sec{padding:24px 26px}fieldset.dos{grid-template-columns:1fr 1fr}.campo.ancho{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
.idioma{display:flex;gap:6px;justify-content:flex-end}
.idioma button{font:600 .85rem var(--body);background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.idioma button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bloqueo{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:10px;padding:14px 16px}
.bloqueo[hidden]{display:none}
</style>

</head>
<body>
<main class="wrap">
  <div class="idioma" role="group" aria-label="Idioma / Language"><button type="button" data-l="es" aria-pressed="false">Español</button><button type="button" data-l="en" aria-pressed="false">English</button></div>
  <header>
    <h1 id="h1"></h1>
    <p class="lead" id="lead"></p>
    <span class="priv" id="priv"></span>
  </header>
  <form id="f" novalidate></form>
  <div class="bloqueo" id="bloqueo" role="alert" hidden></div>
  <details id="vista"><summary id="vista-t"></summary><pre id="json" aria-live="polite"></pre></details>
  <section class="envio" id="envio" hidden aria-live="polite">
    <b id="envio-t"></b>
    <textarea id="envio-x" readonly></textarea>
  </section>
</main>
<div class="barra">
  <span class="estado" id="estado" role="status"></span>
  <button type="button" class="main" id="copiar"></button>
</div>

<script>
const FORM = {"version":2,"titulo":{"es":"Alta de tu asistente de WhatsApp","en":"Set up your WhatsApp assistant"},"secciones":[{"id":"negocio","titulo":{"es":"El negocio","en":"Your business"},"campos":[{"clave":"nombre","etiqueta":{"es":"Nombre del negocio","en":"Business name"},"tipo":"texto","requerido":true},{"clave":"giro","etiqueta":{"es":"Tipo de negocio","en":"Type of business"},"tipo":"opcion","requerido":true,"opciones":[{"v":"hotel","es":"Hotel u hospedaje","en":"Hotel or lodging"},{"v":"restaurante","es":"Restaurante","en":"Restaurant"},{"v":"citas","es":"Negocio de citas (salón, barbería, taller, spa…)","en":"Appointment business (salon, barbershop, auto shop, spa…)"}],"ayuda":{"es":"Define qué datos pide el asistente al reservar o agendar.","en":"This sets what the assistant asks for when someone books."}},{"clave":"pais","etiqueta":{"es":"País del negocio","en":"Country"},"tipo":"opcion","requerido":true,"opciones":[{"v":"US","es":"Estados Unidos","en":"United States"},{"v":"MX","es":"México","en":"Mexico"},{"v":"OTRO","es":"Otro","en":"Other"}],"ayuda":{"es":"Cambia el formato de fechas (3/4 = 4 de marzo en EE. UU.).","en":"Changes the date format (3/4 = March 4 in the US)."}},{"clave":"idioma","etiqueta":{"es":"Idioma en el que escribes tus respuestas","en":"Language you write your answers in"},"tipo":"opcion","requerido":true,"opciones":[{"v":"es","es":"Español","en":"Spanish"},{"v":"en","es":"Inglés","en":"English"}],"ayuda":{"es":"El asistente contesta en el idioma del cliente y traduce tus respuestas si hace falta.","en":"The assistant replies in the customer's language and translates your answers if needed."}},{"clave":"salud","etiqueta":{"es":"¿Atiendes pacientes o manejas información de salud?","en":"Do you treat patients or handle health information?"},"tipo":"opcion","requerido":true,"opciones":[{"v":"no","es":"No","en":"No"},{"v":"si","es":"Sí (clínica, dentista, consultorio…)","en":"Yes (clinic, dentist, medical office…)"}],"ayuda":{"es":"En Estados Unidos WhatsApp no se puede usar para información de salud. Si contestas Sí te proponemos otra vía.","en":"In the United States WhatsApp cannot be used for health information. If you answer Yes we will suggest another channel."}},{"clave":"ciudad","etiqueta":{"es":"Ciudad","en":"City"},"tipo":"texto","requerido":false},{"clave":"direccion","etiqueta":{"es":"Dirección completa","en":"Full address"},"tipo":"texto","requerido":true},{"clave":"zona_horaria","etiqueta":{"es":"Zona horaria","en":"Time zone"},"tipo":"opcion","requerido":true,"opciones":[{"v":"America/New_York","es":"Eastern (New York, Miami)","en":"Eastern (New York, Miami)"},{"v":"America/Chicago","es":"Central (Chicago, Houston)","en":"Central (Chicago, Houston)"},{"v":"America/Denver","es":"Mountain (Denver)","en":"Mountain (Denver)"},{"v":"America/Phoenix","es":"Arizona (sin cambio de hora)","en":"Arizona (no daylight saving)"},{"v":"America/Los_Angeles","es":"Pacific (Los Ángeles)","en":"Pacific (Los Angeles)"},{"v":"America/Anchorage","es":"Alaska","en":"Alaska"},{"v":"Pacific/Honolulu","es":"Hawái","en":"Hawaii"},{"v":"America/Mexico_City","es":"Centro de México (CDMX, Oaxaca)","en":"Central Mexico (Mexico City, Oaxaca)"},{"v":"America/Cancun","es":"Cancún","en":"Cancun"},{"v":"America/Monterrey","es":"Monterrey","en":"Monterrey"},{"v":"America/Tijuana","es":"Tijuana","en":"Tijuana"},{"v":"America/Mazatlan","es":"Pacífico de México (Mazatlán)","en":"Mexican Pacific (Mazatlan)"}]}]},{"id":"whatsapp","titulo":{"es":"WhatsApp","en":"WhatsApp"},"campos":[{"clave":"telefono_bot","etiqueta":{"es":"Número de WhatsApp del asistente (con lada de país, solo dígitos)","en":"WhatsApp number for the assistant (with country code, digits only)"},"tipo":"telefono","requerido":true,"ayuda":{"es":"Debe ser un número que NO esté activo en la app normal de WhatsApp.","en":"It must be a number that is NOT active in the regular WhatsApp app."}},{"clave":"dueno_nombre","etiqueta":{"es":"Quién recibe los avisos","en":"Who receives the alerts"},"tipo":"texto","requerido":true},{"clave":"dueno_telefono","etiqueta":{"es":"WhatsApp de esa persona (con lada de país, solo dígitos)","en":"That person's WhatsApp (with country code, digits only)"},"tipo":"telefono","requerido":true},{"clave":"dueno_correo","etiqueta":{"es":"Correo de esa persona","en":"That person's email"},"tipo":"correo","requerido":false}]},{"id":"respuestas","titulo":{"es":"Lo que el asistente puede contestar (texto real, sin inventar)","en":"What the assistant can answer (real text, nothing made up)"},"campos":[{"clave":"resp_tarifas","etiqueta":{"es":"Tarifas y qué incluyen","en":"Prices and what is included"},"tipo":"largo","requerido":true},{"clave":"resp_horarios","etiqueta":{"es":"Horarios (atención, check-in/check-out, cocina…)","en":"Hours (opening, check-in/check-out, kitchen…)"},"tipo":"largo","requerido":true},{"clave":"resp_ubicacion","etiqueta":{"es":"Cómo llegar / ubicación","en":"How to get there / location"},"tipo":"largo","requerido":true},{"clave":"resp_servicios","etiqueta":{"es":"Servicios o menú (texto editable, no imagen)","en":"Services or menu (editable text, not an image)"},"tipo":"largo","requerido":false},{"clave":"resp_politicas","etiqueta":{"es":"Políticas (cancelación, mascotas, niños, pagos)","en":"Policies (cancellation, pets, children, payments)"},"tipo":"largo","requerido":false}]},{"id":"tono","titulo":{"es":"Tono","en":"Tone"},"campos":[{"clave":"saludo","etiqueta":{"es":"Cómo saluda el asistente (usa {nombre} para tu negocio)","en":"How the assistant greets (use {nombre} for your business)"},"tipo":"largo","requerido":false},{"clave":"pausa_min","etiqueta":{"es":"Minutos que el asistente calla cuando entra una persona","en":"Minutes the assistant stays quiet when a person steps in"},"tipo":"entero","requerido":false,"defecto":30}]}]};
const UI = {
  es: { h1: 'Alta de tu asistente de WhatsApp', lead: 'Escribe los datos reales de tu negocio. El asistente solo contesta con lo que pongas aquí: no inventa precios, horarios ni políticas.', priv: 'Nada se envía desde esta página. Tú copias el resultado y lo mandas.', vista: 'Ver lo que se va a enviar', copiar: 'Copiar datos para enviar', req: 'obligatorio', opt: 'opcional', elige: 'Elige…',
    falta: 'Falta este dato.', tel: 'Solo dígitos, con lada de país. Ejemplos: 529511234567 (México), 15551234567 (EE. UU.).', mail: 'Ese correo no parece válido.', ent: 'Escribe un número entero.',
    listo: 'Todo listo para enviar', faltan: n => `Faltan ${n} dato${n > 1 ? 's' : ''} obligatorio${n > 1 ? 's' : ''}`, revisa: 'Revisa los datos marcados',
    copiado: 'Copiado. Pégalo en un mensaje y mándalo a quien te pidió este formulario.', manual: 'Selecciona todo el texto de abajo, cópialo y mándalo a quien te pidió este formulario.',
    bloqueo: 'En Estados Unidos WhatsApp no se puede usar con información de salud de pacientes (Meta no firma el acuerdo HIPAA). Puedes enviar este formulario igual: te propondremos otra vía, como mensajes de texto con un proveedor que sí lo firme.', telAyuda: 'Con lada de país, sin + ni espacios.' },
  en: { h1: 'Set up your WhatsApp assistant', lead: 'Enter your business\'s real information. The assistant only answers with what you write here: it never makes up prices, hours or policies.', priv: 'Nothing is sent from this page. You copy the result and send it yourself.', vista: 'See what will be sent', copiar: 'Copy details to send', req: 'required', opt: 'optional', elige: 'Choose…',
    falta: 'This field is required.', tel: 'Digits only, with country code. Examples: 15551234567 (US), 529511234567 (Mexico).', mail: 'That email does not look valid.', ent: 'Enter a whole number.',
    listo: 'Ready to send', faltan: n => `${n} required field${n > 1 ? 's' : ''} missing`, revisa: 'Check the highlighted fields',
    copiado: 'Copied. Paste it into a message and send it to whoever gave you this form.', manual: 'Select all the text below, copy it and send it to whoever gave you this form.',
    bloqueo: 'In the United States WhatsApp cannot be used with patient health information (Meta does not sign a HIPAA agreement). You can still send this form: we will propose another channel, such as text messages through a provider that does sign one.', telAyuda: 'With country code, no + or spaces.' },
};
const LLAVE = 'alta-whatsapp-borrador', LLAVE_L = 'alta-whatsapp-idioma';
const $ = x => document.querySelector(x);
const esc = x => String(x).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const guardado = (() => { try { return JSON.parse(localStorage.getItem(LLAVE) || '{}'); } catch { return {}; } })();
let L = (() => { try { const g = localStorage.getItem(LLAVE_L); if (g) return g; } catch {} return /^es/i.test(navigator.language || '') ? 'es' : 'en'; })();
const u = k => UI[L][k];
const campos = FORM.secciones.flatMap(sec => sec.campos);
const valoresActuales = () => Object.fromEntries(campos.map(c => [c.clave, $('#c-' + c.clave) ? $('#c-' + c.clave).value : (guardado[c.clave] ?? c.defecto ?? '')]));
let tocado = false;

function pintar() {
  const v = Object.keys(guardado).length || $('#c-nombre') ? valoresActuales() : null;
  document.documentElement.lang = L;
  $('#h1').textContent = u('h1'); $('#lead').textContent = u('lead'); $('#priv').textContent = u('priv'); $('#vista-t').textContent = u('vista'); $('#copiar').textContent = u('copiar'); $('#envio-x').setAttribute('aria-label', u('copiar'));
  document.querySelectorAll('.idioma button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.l === L)));
  $('#f').innerHTML = FORM.secciones.map(sec => `
    <div class="sec"><fieldset class="${sec.campos.length > 2 && sec.campos.every(c => c.tipo !== 'largo') ? 'dos' : ''}"><legend>${esc(sec.titulo[L])}</legend>
    ${sec.campos.map(c => {
      const val = v ? v[c.clave] : (guardado[c.clave] ?? c.defecto ?? '');
      const base = `id="c-${c.clave}" name="${c.clave}" aria-describedby="a-${c.clave} m-${c.clave}"`;
      const ctl = c.tipo === 'largo' ? `<textarea ${base}>${esc(val)}</textarea>`
        : c.tipo === 'opcion' ? `<select ${base}><option value="">${esc(u('elige'))}</option>${c.opciones.map(o => `<option value="${o.v}"${val === o.v ? ' selected' : ''}>${esc(o[L])}</option>`).join('')}</select>`
        : `<input ${base} value="${esc(val)}" ${c.tipo === 'telefono' ? 'inputmode="numeric" autocomplete="tel-national"' : c.tipo === 'correo' ? 'type="email" autocomplete="email"' : c.tipo === 'entero' ? 'inputmode="numeric"' : 'type="text"'}>`;
      const ancho = c.tipo === 'largo' || c.clave === 'direccion' || c.clave === 'nombre' ? ' ancho' : '';
      const ayuda = c.ayuda ? c.ayuda[L] : c.tipo === 'telefono' ? u('telAyuda') : '';
      return `<div class="campo${ancho}" data-clave="${c.clave}"><label for="c-${c.clave}">${esc(c.etiqueta[L])}<span class="req">${c.requerido ? u('req') : u('opt')}</span></label>${ctl}<p class="ayuda" id="a-${c.clave}">${esc(ayuda)}</p><p class="msg" id="m-${c.clave}"></p></div>`;
    }).join('')}</fieldset></div>`).join('');
  $('#bloqueo').textContent = u('bloqueo');
  revisar();
}
function valor(c) {
  let x = $('#c-' + c.clave).value.trim();
  if (c.tipo === 'telefono') x = x.replace(/[\s+()\-.]/g, '');
  return x;
}
function error(c, x) {
  if (x === '') return c.requerido ? u('falta') : '';
  if (c.tipo === 'telefono' && !/^\d{10,15}$/.test(x)) return u('tel');
  if (c.tipo === 'correo' && !/^\S+@\S+\.\S+$/.test(x)) return u('mail');
  if (c.tipo === 'entero' && !/^\d+$/.test(x)) return u('ent');
  return '';
}
function revisar() {
  const datos = {}; let faltan = 0, malos = 0;
  for (const c of campos) {
    const x = valor(c), e = error(c, x);
    if (e) { if (x === '') faltan++; else malos++; }
    if (x !== '') datos[c.clave] = c.tipo === 'entero' && !e ? Number(x) : x;
    $(`[data-clave="${c.clave}"]`).classList.toggle('err', tocado && !!e);
    $('#m-' + c.clave).textContent = tocado ? e : '';
  }
  $('#bloqueo').hidden = !(datos.pais === 'US' && datos.salud === 'si');
  const listo = faltan === 0 && malos === 0, st = $('#estado');
  st.className = 'estado' + (listo ? ' listo' : '');
  st.textContent = listo ? u('listo') : faltan ? u('faltan')(faltan) : u('revisa');
  const out = { _formulario: FORM.version, ...datos };
  $('#json').textContent = JSON.stringify(out, null, 2);
  try { localStorage.setItem(LLAVE, JSON.stringify(valoresActuales())); } catch {}
  return { listo, texto: JSON.stringify(out, null, 2) };
}
$('#f').addEventListener('input', revisar);
$('#f').addEventListener('change', revisar);
$('#f').addEventListener('submit', e => e.preventDefault());
document.querySelector('.idioma').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.dataset.l === L) return;
  L = b.dataset.l; try { localStorage.setItem(LLAVE_L, L); } catch {}
  pintar();
});
$('#copiar').addEventListener('click', async () => {
  tocado = true;
  const r = revisar();
  const caja = $('#envio'), tt = $('#envio-t'), xx = $('#envio-x');
  if (!r.listo) {
    const primero = $('.campo.err input, .campo.err textarea, .campo.err select');
    if (primero) primero.focus();
    caja.hidden = true; return;
  }
  xx.value = r.texto; caja.hidden = false;
  let ok = false;
  try { await navigator.clipboard.writeText(r.texto); ok = true; } catch {}
  if (!ok) { xx.focus(); xx.select(); try { ok = document.execCommand('copy'); } catch {} }
  tt.textContent = ok ? u('copiado') : u('manual');
  caja.scrollIntoView({ block: 'nearest' });
});
pintar();
</script>

</body>
</html>
